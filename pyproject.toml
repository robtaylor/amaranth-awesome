[project]
name = "amaranth-awesome"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Rob Taylor", email = "rob.taylor@chipflow.io"},
]
dependencies = ["requests>=2.32.3", "python-dotenv>=1.0.1", "smolagents>=1.2.2", "litellm>=1.58.0"]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
fetch = "python fetch.py"
repos = "python find-repos.py"
